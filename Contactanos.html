<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReWear — Contáctanos</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <div class="header-content">
            <img src="img/logo.png" alt="Logotipo de ReWear" class="logo">
            <div>
                <h1>ReWear</h1>
                <p class="eslogan">Ropa que vuelve a tener historia</p>
            </div>
        </div>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="Catalogo.html">Catálogo</a></li>
            <li><a href="Contactanos.html" class="activo">Contáctanos</a></li>
        </ul>
    </nav>

    <main>
        <div class="contenedor-principal">
            <section>
                <h2>Contáctanos</h2>
                <p>¿Tienes dudas con alguna prenda, quieres vender tu ropa o has tenido algún problema con tu pedido? Rellena este formulario y te responderemos en menos de 24 horas.</p>

                <form class="form-vender" action="#" method="POST">

                    <div class="grupo-form">
                        <label for="nombre">Nombre completo</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre completo" required>
                    </div>

                    <div class="grupo-form">
                        <label for="correo">Correo electrónico</label>
                        <input type="email" id="correo" name="correo" placeholder="tu@correo.com" required>
                    </div>

                    <div class="grupo-form">
                        <label for="motivo">Motivo de tu consulta</label>
                        <select id="motivo" name="motivo" required>
                            <option value="" disabled selected>Selecciona una opción</option>
                            <option value="duda">Duda con una talla o prenda</option>
                            <option value="vender">Quiero vender mi ropa</option>
                            <option value="pedido">Problema con un envío</option>
                            <option value="otros">Otros motivos</option>
                        </select>
                    </div>

                    <div class="grupo-form">
                        <label for="mensaje">Mensaje</label>
                        <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>
                    </div>

                    <div class="grupo-form">
                        <button type="submit" class="btn-enviar">Enviar formulario</button>
                    </div>

                </form>
            </section>
        </div>
    </main>

    <footer>
        <p>© 2026 ReWear.</p>
    </footer>

</body>
</html>
